# Standalone nginx.conf. Install the certificate chain and private key at the
# paths below and restrict access to this listener to your client networks.
# Match the CPUs assigned to the proxy and brokers in this farm deployment.
worker_processes 4;

events {
    worker_connections 4096;
}

http {
    # Share limits across nginx workers. Delay short bursts; refuse overflow.
    limit_req_zone $binary_remote_addr zone=per_source:10m rate=20r/s;
    limit_req_zone $server_name zone=farm:1m rate=2000r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;

    upstream brokers {
        zone brokers 64k;
        least_conn;
        # A transient connect failure must leave every live broker eligible.
        server 127.0.0.1:8743 max_conns=768 max_fails=0;
        server 127.0.0.1:8744 max_conns=768 max_fails=0;
        server 127.0.0.1:8745 max_conns=768 max_fails=0;
        server 127.0.0.1:8746 max_conns=768 max_fails=0;
    }

    server {
        listen 443 ssl backlog=4096;
        server_name broker.example.invalid;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_header_timeout 10s;
        client_body_timeout 10s;
        client_max_body_size 8k;
        keepalive_timeout 120s;
        send_timeout 10s;

        location / {
            limit_conn connections 32;
            limit_conn_status 429;
            limit_req zone=per_source burst=20;
            limit_req zone=farm burst=4096;
            limit_req_status 429;

            proxy_request_buffering on;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
            proxy_intercept_errors off;
            # Try one other peer if a token POST has not been sent upstream.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
            proxy_pass http://brokers;
        }
    }
}
