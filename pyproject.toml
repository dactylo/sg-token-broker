# ==========================================================
# Build System
# ==========================================================
[build-system]
build-backend = "hatchling.build"
requires = [ "editables~=0.3", "hatch-fancy-pypi-readme>=25.1", "hatchling>=1.27" ]

# ==========================================================
# Project Metadata
# ==========================================================
[project]
name = "sg-token-broker"
version = "0.1.0"
description = "Authentication broker for Autodesk Flow Production Tracking"
keywords = [
  "authentication",
  "credentials",
  "flow-production-tracking",
  "security",
  "shotgrid",
  "shotgun",
  "token-broker"
]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dynamic = [ "readme" ]
dependencies = [
  "pyyaml>=6.0.3",
  "requests>=2.34.2",
  "urllib3>=1.26,<3",
]
optional-dependencies.google = [
  "cachecontrol>=0.14.4",
  "google-auth>=2.3.2",
]
optional-dependencies.login = [
  "keyring>=24",
]
optional-dependencies.oidc = [
  "cryptography>=42",
  "pyjwt>=2.14,<2.16", # _oidcverify overrides PyJWT internals; widen only after testing
]
urls.Documentation = "https://github.com/dactylo/sg-token-broker/tree/main/docs"
urls.Homepage = "https://github.com/dactylo/sg-token-broker"
urls.Issues = "https://github.com/dactylo/sg-token-broker/issues"
urls.Repository = "https://github.com/dactylo/sg-token-broker"
scripts.sg-token-broker = "sg_token_broker._cli:main"

[dependency-groups]
dev = [
  "mdformat",
  "mdformat-config",
  "mdformat-frontmatter",
  "mdformat-gfm",
  "mdformat-pyproject",
  "mdformat-ruff",
  "mdformat-shfmt",
  "pyproject-fmt",
  "pyright",
  "ruff",
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-xdist>=3.2",
]
ci-build = [
  "cython>=3",
  "setuptools>=84",
]

[tool.hatch]
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
build.targets.wheel.packages = [ "src/sg_token_broker" ]
build.targets.sdist.include = [ "/README.md", "/src" ]

# Keep checkout links relative; package links target this release.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]\n]*\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://raw.githubusercontent.com/dactylo/sg-token-broker/v$HFPR_VERSION/\2\3'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)(\[[^\]\n]+\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://github.com/dactylo/sg-token-broker/blob/v$HFPR_VERSION/\2\3'

[tool.uv]
# CI supplies native Taplo; mdformat-config 0.2.1 otherwise pulls a Python Taplo wheel.
exclude-dependencies = [
  { package = { name = "mdformat-config", version = "0.2.1" }, dependencies = [ "taplo" ] },
]

# ==========================================================
# Ruff Configuration
# ==========================================================
[tool.ruff]
target-version = "py311"
line-length = 99
format.quote-style = "single"
format.exclude = [ "*.md" ]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # Conflicts with the Ruff formatter
  "CPY001", # Copyright notices are not required
  "EM101",  # Exception must not use string literal
  "EM102",  # Exception must not use f-string literal
  "FBT001", # Boolean positional arg in function definition
  "FBT002", # Boolean default value in function definition
  "Q000",   # Conflicts with the Ruff formatter
  "Q003",   # Conflicts with the Ruff formatter
  "T201",   # print() found
  "TRY003", # Avoid specifying long messages outside exception class
]
# Same-file private-member collaboration; retain checking in other files.
lint.per-file-ignores."scripts/verify_sg_human_session.py" = [ "SLF001" ]
lint.per-file-ignores."scripts/verify_sg_sudo.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_token_broker/_cache.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_token_broker/_http.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_token_broker/_userauth.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_token_broker/_userhttp.py" = [ "SLF001" ]
lint.per-file-ignores."tests/**/*.py" = [
  "D",       # No docstrings required in tests
  "PLR2004", # Allow magic values in tests
  "S101",    # Allow asserts in tests
  "S603",    # Allow subprocess calls in tests
  "S607",    # Allow partial executable paths in tests
  "SLF001",  # Tests intentionally inspect and patch private state
]
lint.pydocstyle.convention = "google"

[tool.pyproject-fmt]
max_supported_python = "3.15"

# ==========================================================
# Pyright Configuration
# ==========================================================
[tool.pyright]
pythonVersion = "3.11"  # Keep in sync with tool.ruff.target-version
typeCheckingMode = "strict"
extraPaths = [ ".", "src" ]
executionEnvironments = [
  { root = "tests", reportPrivateUsage = "none" },
  { root = "." },
]

# ==========================================================
# Pytest Configuration
# ==========================================================
[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = [ "-q", "--strict-markers", "--tb=short" ]
ini_options.markers = [ "slow: marks tests as slow (deselect with '-m \"not slow\"')" ]
ini_options.faulthandler_timeout = 300

# ==========================================================
# Mdformat Configuration (Requires mdformat-pyproject)
# ==========================================================
[tool.mdformat]
wrap = 99  # Keep in sync with tool.ruff.line-length
number = true
